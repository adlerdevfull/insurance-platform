services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    environment: &app-env
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: insurance_secret_key_change_in_prod
      DB_HOST: mysql
      DB_DATABASE: insurance_db
      DB_USER: insurance
      DB_PASSWORD: insurance
      DATABASE_URL: mysql://insurance:insurance@mysql:3306/insurance_db?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_PASSPHRASE: insurance_jwt_passphrase
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [insurance]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["php", "/var/www/html/bin/console", "app:worker:claims", "--env=dev"]
    volumes:
      - .:/var/www/html
    environment:
      <<: *app-env
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [insurance]

  nginx:
    image: nginx:alpine
    ports:
      - "8140:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
    networks: [insurance]

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3008:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    networks: [insurance]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: insurance_db
      MYSQL_USER: insurance
      MYSQL_PASSWORD: insurance
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "insurance", "-pinsurance"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [insurance]

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [insurance]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [insurance]

volumes:
  mysql_data:

networks:
  insurance:
    driver: bridge
